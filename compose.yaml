services:
  portwatch:
    build: .
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-}
    volumes:
      - ./config:/app/config:ro
      - portwatch-data:/data

volumes:
  portwatch-data:
